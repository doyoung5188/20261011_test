<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청소당번 뽑기</title>
<style>
  :root {
    --bg: #f6f4ee;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #6b7280;
    --line: #e5e1d6;
    --accent: #2f7d5b;
    --accent-soft: #e3f1ea;
    --flash: #f4b63f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 760px; }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { margin: 0 0 6px; font-size: 2rem; }
  header p { margin: 0; color: var(--muted); }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 1rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* 오늘의 당번 칸 */
  .slots {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .slot {
    aspect-ratio: 1;
    border-radius: 16px;
    border: 2px dashed var(--line);
    display: grid;
    place-items: center;
    font-size: clamp(1.6rem, 6vw, 2.8rem);
    font-weight: 800;
    color: #c9c3b4;
    transition: all .25s ease;
  }
  .slot.filled {
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    animation: pop .35s ease;
  }
  .slot small { font-size: .45em; margin-left: 2px; }

  @keyframes pop {
    0% { transform: scale(.6); }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* 전체 번호 */
  .pool {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
  }
  .num {
    aspect-ratio: 1;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 1.1rem;
    transition: background .08s, transform .08s, color .08s;
  }
  .num.flash { background: var(--flash); color: #fff; transform: scale(1.08); border-color: var(--flash); }
  .num.chosen { background: var(--accent); color: #fff; border-color: var(--accent); }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 14px 34px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #drawBtn { background: var(--accent); color: #fff; }
  #copyBtn { background: #fff; color: var(--ink); border: 1px solid var(--line); }

  .summary {
    text-align: center;
    margin-top: 16px;
    min-height: 1.5em;
    font-size: 1.1rem;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .slots { gap: 6px; }
    header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧹 청소당번 뽑기</h1>
    <p>1~14번, 21~32번 학생 중 5명을 무작위로 뽑습니다</p>
  </header>

  <section class="panel">
    <h2>오늘의 청소당번</h2>
    <div class="slots" id="slots"></div>
    <div class="summary" id="summary"></div>
  </section>

  <div class="controls">
    <button id="drawBtn">뽑기 시작</button>
    <button id="copyBtn" disabled>결과 복사</button>
  </div>

  <section class="panel" style="margin-top:20px;">
    <h2>전체 학생 번호 (<span id="total"></span>명)</h2>
    <div class="pool" id="pool"></div>
  </section>
</div>

<script>
  // ===== 설정 =====
  const PICK_COUNT = 5; // 뽑을 인원 수

  function range(start, end) {
    const arr = [];
    for (let i = start; i <= end; i++) arr.push(i);
    return arr;
  }

  // 대상 학생 번호: 1~14번, 21~32번
  const students = [...range(1, 14), ...range(21, 32)];

  // ===== 화면 요소 =====
  const poolEl = document.getElementById("pool");
  const slotsEl = document.getElementById("slots");
  const summaryEl = document.getElementById("summary");
  const drawBtn = document.getElementById("drawBtn");
  const copyBtn = document.getElementById("copyBtn");
  document.getElementById("total").textContent = students.length;

  const numEls = {};
  students.forEach(n => {
    const div = document.createElement("div");
    div.className = "num";
    div.textContent = n;
    poolEl.appendChild(div);
    numEls[n] = div;
  });

  function resetSlots() {
    slotsEl.innerHTML = "";
    for (let i = 0; i < PICK_COUNT; i++) {
      const s = document.createElement("div");
      s.className = "slot";
      s.textContent = "?";
      slotsEl.appendChild(s);
    }
  }
  resetSlots();

  // ===== 무작위 섞기 (피셔-예이츠) =====
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let lastResult = [];

  async function draw() {
    drawBtn.disabled = true;
    copyBtn.disabled = true;
    summaryEl.textContent = "";
    resetSlots();
    Object.values(numEls).forEach(el => el.classList.remove("chosen", "flash"));

    const winners = shuffle(students).slice(0, PICK_COUNT);
    const chosen = new Set();

    for (let i = 0; i < winners.length; i++) {
      const remaining = students.filter(n => !chosen.has(n));

      // 번호가 돌아가는 연출
      const spins = reduceMotion ? 0 : 14;
      for (let k = 0; k < spins; k++) {
        const n = remaining[Math.floor(Math.random() * remaining.length)];
        numEls[n].classList.add("flash");
        await sleep(50 + k * 8);
        numEls[n].classList.remove("flash");
      }

      // 당첨 확정
      const w = winners[i];
      chosen.add(w);
      numEls[w].classList.add("chosen");
      const slot = slotsEl.children[i];
      slot.innerHTML = w + "<small>번</small>";
      slot.classList.add("filled");
      await sleep(reduceMotion ? 50 : 350);
    }

    lastResult = [...winners].sort((a, b) => a - b);
    summaryEl.textContent = "청소당번: " + lastResult.map(n => n + "번").join(", ");
    drawBtn.textContent = "다시 뽑기";
    drawBtn.disabled = false;
    copyBtn.disabled = false;
  }

  async function copyResult() {
    const text = "오늘의 청소당번: " + lastResult.map(n => n + "번").join(", ");
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "복사됨!";
    } catch (e) {
      copyBtn.textContent = "복사 실패";
    }
    setTimeout(() => (copyBtn.textContent = "결과 복사"), 1500);
  }

  drawBtn.addEventListener("click", draw);
  copyBtn.addEventListener("click", copyResult);
</script>
</body>
</html>
